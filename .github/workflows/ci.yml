name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Étape 1 : rapide, à chaque push sur une PR.
  preliminary-tests:
    name: preliminary-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - run: composer test:unit

  # Étape 2 : lente, seulement dans la merge queue (et sur main après merge).
  pre-merge-tests:
    name: pre-merge-tests
    if: github.event_name == 'push' || startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    env:
      SLOW_TESTS_SECONDS: '45'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - run: composer test:unit
      - run: composer test:integration
